services:
  tradingagents:
    build: .
    env_file:
      - .env
    volumes:
      - tradingagents_data:/home/appuser/.tradingagents
    tty: true
    stdin_open: true

  # HTTP API for Rails / other clients. Poll POST /api/v1/analyses then GET job.
  tradingagents-api:
    build: .
    entrypoint: ["tradingagents-api"]
    env_file:
      - .env
    environment:
      - TRADINGAGENTS_API_HOST=0.0.0.0
      - TRADINGAGENTS_API_PORT=8000
      # Set TRADINGAGENTS_API_KEY in .env before exposing this service.
    ports:
      - "${TRADINGAGENTS_API_PORT:-8000}:8000"
    volumes:
      - tradingagents_data:/home/appuser/.tradingagents
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  ollama:
    image: ollama/ollama:latest
    volumes:
      - ollama_data:/root/.ollama
    profiles:
      - ollama

  tradingagents-ollama:
    build: .
    env_file:
      - .env
    environment:
      - TRADINGAGENTS_LLM_PROVIDER=ollama
      - OLLAMA_BASE_URL=http://ollama:11434/v1
    volumes:
      - tradingagents_data:/home/appuser/.tradingagents
    depends_on:
      - ollama
    tty: true
    stdin_open: true
    profiles:
      - ollama

volumes:
  tradingagents_data:
  ollama_data:
